<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vera — artist portfolio">
  <title>Vera — Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Vera home">
      <span class="brand-mark">VERA</span>
      <span class="brand-meta">portfolio</span>
      <span class="brand-year" id="headerYear"></span>
    </a>
    <a class="email-button" id="emailLink" href="#">Email</a>
  </header>

  <nav class="main-nav" aria-label="Primary navigation">
    <a href="#works">Works <span id="navYear"></span></a>
    <a href="#free-art">Free arts</a>
    <a href="#practice">Practice WIP</a>
    <a href="#about">About: Jun / Vera / veradcsion</a>
  </nav>

  <main id="top">
    <section class="section works-section" id="works">
      <div class="section-heading">
        <h1 id="worksTitle"></h1>
        <p id="worksIntro"></p>
      </div>
      <div class="works-grid" id="worksGrid"></div>
    </section>

    <section class="album-section" id="free-art">
      <div class="section-heading">
        <h2 id="albumTitle"></h2>
        <p id="albumIntro"></p>
      </div>

      <div class="album-feature">
        <div class="album-ghost" aria-hidden="true">Portfolio</div>
        <div class="album-copy">
          <h3 id="albumHeadline"></h3>
          <p id="albumText"></p>
          <a class="red-button" id="albumButton" href="#collection">Collection</a>
        </div>
        <img class="album-image" id="albumImage" alt="">
      </div>
    </section>

    <section class="practice-section" id="practice">
      <div class="practice-hero">
        <img id="heroImage" alt="">
        <div class="practice-overlay">
          <h2 id="practiceTitle"></h2>
          <div class="practice-actions">
            <a class="red-button" href="#collection">Call to action</a>
            <a class="ghost-button" href="#works">Secondary</a>
          </div>
        </div>
      </div>
    </section>

    <section class="collection-section" id="collection">
      <div class="collection-grid" id="collectionGrid"></div>
    </section>

    <section class="about-section" id="about">
      <div>
        <span class="eyebrow">About</span>
        <h2 id="aboutTitle"></h2>
      </div>
      <p id="aboutText"></p>
    </section>
  </main>

  <footer>
    <span>© <span id="footerYear"></span> Vera</span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
